name: Tag Release

on:
  pull_request:
    types: [closed]

jobs:
  create-tag:
    # Only run when a version-bump PR is merged to main
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'version-bump/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get version from VERSION file
        id: get_version
        run: |
          if [ ! -f VERSION ]; then
            echo "Error: VERSION file not found"
            exit 1
          fi

          VERSION=$(cat VERSION)

          if [ -z "$VERSION" ]; then
            echo "Error: VERSION file is empty"
            exit 1
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version from VERSION file: ${VERSION}"

      - name: Create and push git tag
        id: create_tag
        run: |
          TAG_NAME="v${{ steps.get_version.outputs.version }}"

          # Check if tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists, skipping"
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Create annotated tag
          if ! git tag -a "$TAG_NAME" -m "Release $TAG_NAME"; then
            echo "Error: Failed to create tag $TAG_NAME"
            exit 1
          fi

          # Push tag
          if ! git push origin "$TAG_NAME"; then
            echo "Error: Failed to push tag $TAG_NAME"
            exit 1
          fi

          echo "Successfully created and pushed tag $TAG_NAME"
          echo "created=true" >> $GITHUB_OUTPUT

      - name: Report tag creation
        run: |
          TAG_CREATED="${{ steps.create_tag.outputs.created }}"
          TAG_NAME="v${{ steps.get_version.outputs.version }}"

          if [ "$TAG_CREATED" = "true" ]; then
            echo "Tag Creation Summary"
            echo "Version: ${{ steps.get_version.outputs.version }}"
            echo "Tag:     $TAG_NAME (created and pushed)"
            echo "PR:      #${{ github.event.pull_request.number }}"

            # Write to GitHub step summary for better visibility
            {
              echo "## Tag Creation Summary"
              echo "- **Version:** ${{ steps.get_version.outputs.version }}"
              echo "- **Tag:** \`$TAG_NAME\` (created and pushed)"
              echo "- **PR:** #${{ github.event.pull_request.number }}"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "Tag Summary"
            echo "Version: ${{ steps.get_version.outputs.version }}"
            echo "Tag:     $TAG_NAME (already exists, skipped)"
            echo "PR:      #${{ github.event.pull_request.number }}"

            # Write to GitHub step summary for better visibility
            {
              echo "## Tag Summary"
              echo "- **Version:** ${{ steps.get_version.outputs.version }}"
              echo "- **Tag:** \`$TAG_NAME\` (already exists, skipped)"
              echo "- **PR:** #${{ github.event.pull_request.number }}"
            } >> $GITHUB_STEP_SUMMARY
          fi
