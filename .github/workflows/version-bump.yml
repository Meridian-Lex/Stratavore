name: Version Bump

on:
  pull_request:
    types: [closed]

# Only run when the PR is merged
jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push back to repo
      pull-requests: write  # Required to create PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(cat VERSION)
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          echo "Current version: ${CURRENT_VERSION}"

      - name: Determine bump type
        id: bump_type
        run: |
          COMMIT_MSG="${{ github.event.pull_request.title }}"

          if echo "$COMMIT_MSG" | grep -qiE "^BREAKING CHANGE:|breaking change:"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qiE "^feat(\(.+\))?:|^feature:"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qiE "^fix(\(.+\))?:|^bugfix:"; then
            echo "type=patch" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qiE "^major:"; then
            echo "type=major" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi
          echo "Bump type: ${{ steps.bump_type.outputs.type }}"

      - name: Bump version
        id: new_version
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.type }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$BUMP_TYPE" in
            major)
              NEW_MAJOR=$((MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
              ;;
            minor)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=0
              ;;
            patch)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$MINOR
              NEW_PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: ${NEW_VERSION}"

      - name: Update VERSION file
        run: echo "${{ steps.new_version.outputs.version }}" > VERSION

      - name: Update version in stratavored
        run: |
          sed -i "s/Version   = \"[^\"]*\"/Version   = \"${{ steps.new_version.outputs.version }}\"/" cmd/stratavored/main.go
          echo "Updated cmd/stratavored/main.go"

      - name: Update version in stratavore CLI
        run: |
          sed -i "s/Version   = \"[^\"]*\"/Version   = \"${{ steps.new_version.outputs.version }}\"/" cmd/stratavore/main.go
          echo "Updated cmd/stratavore/main.go"

      - name: Update version in stratavore-agent
        run: |
          sed -i "s/Version     = \"[^\"]*\"/Version     = \"${{ steps.new_version.outputs.version }}\"/" cmd/stratavore-agent/main.go
          echo "Updated cmd/stratavore-agent/main.go"

      - name: Update version in stratavore-migrate
        run: |
          sed -i "s/Version   = \"[^\"]*\"/Version   = \"${{ steps.new_version.outputs.version }}\"/" cmd/stratavore-migrate/main.go
          echo "Updated cmd/stratavore-migrate/main.go"

      - name: Verify version updates
        run: |
          echo "=== VERSION file ==="
          cat VERSION
          echo ""
          echo "=== stratavored version ==="
          grep 'Version   =' cmd/stratavored/main.go
          echo ""
          echo "=== stratavore version ==="
          grep 'Version   =' cmd/stratavore/main.go
          echo ""
          echo "=== stratavore-agent version ==="
          grep 'Version     =' cmd/stratavore-agent/main.go
          echo ""
          echo "=== stratavore-migrate version ==="
          grep 'Version   =' cmd/stratavore-migrate/main.go

      - name: Build binaries
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make build

      - name: Verify bin artifacts
        run: |
          for b in bin/stratavore bin/stratavored bin/stratavore-agent bin/stratavore-migrate; do
            test -f "$b" || (echo "$b missing" && exit 1)
          done

      - name: Create version bump branch
        run: |
          git checkout -b "version-bump/${{ steps.new_version.outputs.version }}"

      - name: Commit version bump
        run: |
          git add VERSION cmd/stratavored/main.go cmd/stratavore/main.go cmd/stratavore-agent/main.go cmd/stratavore-migrate/main.go
          git commit -m "chore: bump version to ${{ steps.new_version.outputs.version }} [skip ci]" || echo "Nothing to commit"

      - name: Create git tag
        run: git tag -a "v${{ steps.new_version.outputs.version }}" -m "Release v${{ steps.new_version.outputs.version }}"

      - name: Push branch and tag
        run: |
          git push origin "version-bump/${{ steps.new_version.outputs.version }}"
          git push origin "v${{ steps.new_version.outputs.version }}"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "version-bump/${{ steps.new_version.outputs.version }}" \
            --title "chore: bump version to ${{ steps.new_version.outputs.version }}" \
            --body "Version bump triggered by merged PR #${{ github.event.pull_request.number }}

Automated version bump from ${{ steps.current_version.outputs.version }} to ${{ steps.new_version.outputs.version }}.

Bump type: ${{ steps.bump_type.outputs.type }}
Original PR: #${{ github.event.pull_request.number }} (${{ github.event.pull_request.title }})" \
            --label "chore" \
            --label "automated"

      - name: Report version bump
        run: |
          echo "Version Bump Summary"
          echo "Previous: ${{ steps.current_version.outputs.version }}"
          echo "Current:  ${{ steps.new_version.outputs.version }}"
          echo "Type:     ${{ steps.bump_type.outputs.type }}"
          echo "PR:       ${{ github.event.pull_request.number }}"
          echo "Title:    ${{ github.event.pull_request.title }}"
