name: Version Bump

on:
  pull_request:
    types: [closed]

# Only run when the PR is merged
jobs:
  bump-version:
    # ISSUE #1: Prevent infinite loop - skip if this is a version-bump PR
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && !startsWith(github.event.pull_request.head.ref, 'version-bump/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push back to repo
      pull-requests: write  # Required to create PRs
    env:
      # ISSUE #3: Script injection - move PR title and body to job-level env vars for safe interpolation
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main  # ISSUE #2: Use main branch for synthetic merge checkout
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(cat VERSION)
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          echo "Current version: ${CURRENT_VERSION}"

      - name: Determine bump type
        id: bump_type
        run: |
          # ISSUE #5: Check both title AND body for breaking changes
          COMMIT_MSG="$PR_TITLE"
          PR_BODY_TEXT="$PR_BODY"

          if echo "$COMMIT_MSG" | grep -qiE "^BREAKING CHANGE:|breaking change:" || \
             echo "$PR_BODY_TEXT" | grep -qiE "^BREAKING CHANGE:|breaking change:"; then
            BUMP_TYPE="major"
          elif echo "$COMMIT_MSG" | grep -qiE "^feat(\(.+\))?:|^feature:"; then
            BUMP_TYPE="minor"
          elif echo "$COMMIT_MSG" | grep -qiE "^fix(\(.+\))?:|^bugfix:"; then
            BUMP_TYPE="patch"
          elif echo "$COMMIT_MSG" | grep -qiE "^major:"; then
            BUMP_TYPE="major"
          else
            BUMP_TYPE="patch"
          fi

          echo "type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Output bump type
        # ISSUE #4: Move echo statement to separate step after bump_type completes
        run: echo "Bump type: ${{ steps.bump_type.outputs.type }}"

      - name: Bump version
        id: new_version
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.type }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$BUMP_TYPE" in
            major)
              NEW_MAJOR=$((MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
              ;;
            minor)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=0
              ;;
            patch)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$MINOR
              NEW_PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: ${NEW_VERSION}"

      - name: Update VERSION file
        run: echo "${{ steps.new_version.outputs.version }}" > VERSION

      - name: Update version in stratavored
        run: |
          # ISSUE #8: Robust sed patterns - handle variable whitespace
          sed -i "s/Version[[:space:]]*=[[:space:]]*\"[^\"]*\"/Version   = \"${{ steps.new_version.outputs.version }}\"/" cmd/stratavored/main.go
          echo "Updated cmd/stratavored/main.go"

      - name: Update version in stratavore CLI
        run: |
          # ISSUE #8: Robust sed patterns - handle variable whitespace
          sed -i "s/Version[[:space:]]*=[[:space:]]*\"[^\"]*\"/Version   = \"${{ steps.new_version.outputs.version }}\"/" cmd/stratavore/main.go
          echo "Updated cmd/stratavore/main.go"

      - name: Update version in stratavore-agent
        run: |
          # ISSUE #8: Robust sed patterns - handle variable whitespace
          sed -i "s/Version[[:space:]]*=[[:space:]]*\"[^\"]*\"/Version     = \"${{ steps.new_version.outputs.version }}\"/" cmd/stratavore-agent/main.go
          echo "Updated cmd/stratavore-agent/main.go"

      - name: Update version in stratavore-migrate
        run: |
          # ISSUE #8: Robust sed patterns - handle variable whitespace
          sed -i "s/Version[[:space:]]*=[[:space:]]*\"[^\"]*\"/Version   = \"${{ steps.new_version.outputs.version }}\"/" cmd/stratavore-migrate/main.go
          echo "Updated cmd/stratavore-migrate/main.go"

      - name: Verify version updates
        run: |
          echo "=== VERSION file ==="
          cat VERSION
          echo ""
          echo "=== stratavored version ==="
          grep 'Version   =' cmd/stratavored/main.go
          echo ""
          echo "=== stratavore version ==="
          grep 'Version   =' cmd/stratavore/main.go
          echo ""
          echo "=== stratavore-agent version ==="
          grep 'Version     =' cmd/stratavore-agent/main.go
          echo ""
          echo "=== stratavore-migrate version ==="
          grep 'Version   =' cmd/stratavore-migrate/main.go

      - name: Build binaries
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make build

      - name: Verify bin artifacts
        run: |
          for b in bin/stratavore bin/stratavored bin/stratavore-agent bin/stratavore-migrate; do
            test -f "$b" || (echo "$b missing" && exit 1)
          done

      - name: Create version bump branch
        run: |
          # ISSUE #9: Use consistent version-bump/ prefix pattern
          git checkout -b "version-bump/${{ steps.new_version.outputs.version }}"

      - name: Commit version bump
        run: |
          git add VERSION cmd/stratavored/main.go cmd/stratavore/main.go cmd/stratavore-agent/main.go cmd/stratavore-migrate/main.go
          # ISSUE #7: Replace || echo with explicit git diff check for failure detection
          if git diff --cached --exit-code > /dev/null; then
            echo "No changes to commit (all files already up-to-date)"
          else
            git commit -m "chore: bump version to ${{ steps.new_version.outputs.version }} [skip ci]"
          fi

      - name: Push version-bump branch
        # ISSUE #11: Explicit error handling for git operations
        run: |
          if ! git push origin "version-bump/${{ steps.new_version.outputs.version }}"; then
            echo "Error: Failed to push version-bump branch"
            exit 1
          fi

      - name: Create git tag on version-bump branch
        # ISSUE #6: Tag created on version-bump branch; merge to main will happen via PR approval
        # After PR approval and merge to main, tag will be pushed from main
        # ISSUE #11: Explicit error handling for tag creation
        run: |
          if ! git tag -a "v${{ steps.new_version.outputs.version }}" -m "Release v${{ steps.new_version.outputs.version }}"; then
            echo "Error: Failed to create tag"
            exit 1
          fi

      - name: Push tag
        # ISSUE #11: Explicit error handling for git operations
        run: |
          if ! git push origin "v${{ steps.new_version.outputs.version }}"; then
            echo "Error: Failed to push tag"
            exit 1
          fi

      - name: Create pull request
        # ISSUE #10: Permissions validation - uses GITHUB_TOKEN in GH_TOKEN env var
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ISSUE #11: Explicit error handling for PR creation
          if ! gh pr create \
            --base main \
            --head "version-bump/${{ steps.new_version.outputs.version }}" \
            --title "chore: bump version to ${{ steps.new_version.outputs.version }}" \
            --body "Version bump triggered by merged PR #${{ github.event.pull_request.number }}

Automated version bump from ${{ steps.current_version.outputs.version }} to ${{ steps.new_version.outputs.version }}.

Bump type: ${{ steps.bump_type.outputs.type }}
Original PR: #${{ github.event.pull_request.number }} ($PR_TITLE)" \
            --label "chore" \
            --label "automated"; then
            echo "Error: Failed to create pull request"
            exit 1
          fi

      - name: Report version bump
        run: |
          echo "Version Bump Summary"
          echo "Previous: ${{ steps.current_version.outputs.version }}"
          echo "Current:  ${{ steps.new_version.outputs.version }}"
          echo "Type:     ${{ steps.bump_type.outputs.type }}"
          echo "PR:       ${{ github.event.pull_request.number }}"
          echo "Title:    ${{ github.event.pull_request.title }}"
