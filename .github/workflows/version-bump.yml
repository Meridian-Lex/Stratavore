name: Version Bump

on:
  pull_request:
    types: [closed]

# Only run when the PR is merged
jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push back to repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(cat VERSION)
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          echo "Current version: ${CURRENT_VERSION}"

      - name: Determine bump type
        id: bump_type
        run: |
          COMMIT_MSG="${{ github.event.pull_request.title }}"

          if echo "$COMMIT_MSG" | grep -qiE "^BREAKING CHANGE:|breaking change:"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qiE "^feat(\(.+\))?:|^feature:"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qiE "^fix(\(.+\))?:|^bugfix:"; then
            echo "type=patch" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qiE "^major:"; then
            echo "type=major" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi
          echo "Bump type: ${{ steps.bump_type.outputs.type }}"

      - name: Bump version
        id: new_version
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.type }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$BUMP_TYPE" in
            major)
              NEW_MAJOR=$((MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
              ;;
            minor)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=0
              ;;
            patch)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$MINOR
              NEW_PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: ${NEW_VERSION}"

      - name: Update VERSION file
        run: echo "${{ steps.new_version.outputs.version }}" > VERSION

      - name: Update versions in source files
        run: |
          for f in cmd/stratavored/main.go cmd/stratavore/main.go cmd/stratavore-agent/main.go cmd/stratavore-migrate/main.go; do
            sed -i "s/Version *=[^\"\']*/Version = \"${{ steps.new_version.outputs.version }}\"/" "$f"
          done

      - name: Build binaries
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make build

      - name: Verify bin artifacts
        run: |
          for b in bin/stratavore bin/stratavored bin/stratavore-agent bin/stratavore-migrate; do
            test -f "$b" || (echo "$b missing" && exit 1)
          done

      - name: Commit version bump
        run: |
          git add VERSION cmd/stratavored/main.go cmd/stratavore/main.go cmd/stratavore-agent/main.go cmd/stratavore-migrate/main.go
          git commit -m "chore: bump version to ${{ steps.new_version.outputs.version }} [skip ci]" || echo "Nothing to commit"

      - name: Create git tag
        run: git tag -a "v${{ steps.new_version.outputs.version }}" -m "Release v${{ steps.new_version.outputs.version }}"

      - name: Push changes and tag
        run: |
          git push origin main
          git push origin "v${{ steps.new_version.outputs.version }}"

      - name: Report version bump
        run: |
          echo "Version Bump Summary"
          echo "Previous: ${{ steps.current_version.outputs.version }}"
          echo "Current:  ${{ steps.new_version.outputs.version }}"
          echo "Type:     ${{ steps.bump_type.outputs.type }}"
          echo "PR:       ${{ github.event.pull_request.number }}"
          echo "Title:    ${{ github.event.pull_request.title }}"
